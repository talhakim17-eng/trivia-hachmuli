<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לומדים אנגלית</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-soft: #6b6b6b;
    --accent: #6c5ce7;
    --accent-dark: #5240c9;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --border: #e5e0d8;
    --shadow: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1b2e;
      --card-bg: #2a2640;
      --text: #f2f0f7;
      --text-soft: #b3aecb;
      --accent: #a29bfe;
      --accent-dark: #8b7ff0;
      --border: #3d3860;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1b2e;
    --card-bg: #2a2640;
    --text: #f2f0f7;
    --text-soft: #b3aecb;
    --accent: #a29bfe;
    --accent-dark: #8b7ff0;
    --border: #3d3860;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-soft);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 28px 20px;
    text-align: center;
  }

  .progress-wrap {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .swatch {
    width: 90px;
    height: 90px;
    border-radius: 16px;
    margin: 0 auto 18px auto;
    border: 3px solid var(--border);
  }

  .swatch-emoji {
    width: 90px;
    height: 90px;
    border-radius: 16px;
    margin: 0 auto 18px auto;
    border: 3px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  .question-word {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
    word-break: break-word;
  }

  .question-hint {
    color: var(--text-soft);
    margin-bottom: 22px;
    font-size: 0.95rem;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option-btn {
    padding: 14px 10px;
    font-size: 1.1rem;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .option-btn:disabled {
    cursor: default;
  }
  .option-btn.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }
  .option-btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong);
    color: white;
  }

  .feedback {
    min-height: 28px;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .feedback.correct-text { color: var(--correct); }
  .feedback.wrong-text { color: var(--wrong); }

  .next-btn, .restart-btn {
    margin-top: 18px;
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .next-btn:hover, .restart-btn:hover {
    background: var(--accent-dark);
  }
  .next-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .score-emoji {
    font-size: 3.5rem;
    margin-bottom: 10px;
  }
  .score-text {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .score-sub {
    color: var(--text-soft);
    margin-bottom: 10px;
  }

  .word-list-title {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 1.05rem;
    text-align: center;
  }
  .word-list {
    margin-top: 6px;
    text-align: right;
    font-size: 0.95rem;
    color: var(--text);
  }
  .word-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--border);
  }
  .word-list-row:last-child {
    border-bottom: none;
  }
  .word-list-he {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .word-list-swatch {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .word-list-emoji {
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .word-list-en {
    color: var(--text-soft);
  }

  /* --- Home / mode selection --- */
  .mode-select {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    text-align: right;
    transition: transform 0.1s ease, border-color 0.2s ease;
  }
  .mode-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .mode-btn-emoji {
    font-size: 2.2rem;
    flex-shrink: 0;
  }
  .mode-btn-text {
    text-align: right;
  }
  .mode-btn-title {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 2px;
  }
  .mode-btn-sub {
    font-size: 0.85rem;
    color: var(--text-soft);
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: var(--accent);
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0;
  }
  .back-link:hover {
    text-decoration: underline;
  }

  /* --- Flashcards --- */
  .flash-counter {
    text-align: center;
    color: var(--text-soft);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .flash-card-outer {
    perspective: 1200px;
    margin-bottom: 20px;
  }
  .flash-card {
    position: relative;
    width: 100%;
    height: 240px;
    cursor: pointer;
  }
  .flash-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .flash-card.flipped .flash-card-inner {
    transform: rotateY(180deg);
  }
  .flash-face {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 18px;
    border: 2px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .flash-face-back {
    transform: rotateY(180deg);
  }
  .flash-visual {
    font-size: 3.5rem;
    margin-bottom: 10px;
  }
  .flash-visual-swatch {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    border: 3px solid var(--border);
    margin-bottom: 10px;
  }
  .flash-word {
    font-size: 1.7rem;
    font-weight: 700;
  }
  .flash-tap-hint {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-soft);
  }
  .flash-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .flash-nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .flash-nav-btn:hover {
    background: var(--accent-dark);
  }
  .flash-nav-btn.secondary {
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    flex: 0 0 auto;
    padding: 12px 16px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎓 לומדים אנגלית</h1>
  <div class="subtitle">תרגול מילים שבועי</div>
  <div class="card" id="card"></div>
</div>

<script>
  // he = Hebrew meaning, en = English word, translit = how to pronounce the
  // English word, written in Hebrew letters.
  // Visual hint: "color" for a color swatch, or "emoji" for a picture hint.
  const words = [
    // יחידה 1: צבעים
    { he: "שחור", en: "BLACK",  translit: "בלאק",   color: "#111111" },
    { he: "לבן",  en: "WHITE",  translit: "וויט",    color: "#ffffff" },
    { he: "אדום", en: "RED",    translit: "רד",      color: "#e74c3c" },
    { he: "כחול", en: "BLUE",   translit: "בלו",     color: "#3498db" },
    { he: "צהוב", en: "YELLOW", translit: "ילו",     color: "#f1c40f" },
    { he: "ירוק", en: "GREEN",  translit: "גרין",    color: "#2ecc71" },
    { he: "כתום", en: "ORANGE", translit: "אורנג'",  color: "#e67e22" },
    { he: "ורוד", en: "PINK",   translit: "פינק",    color: "#ff7fb0" },
    { he: "חום",  en: "BROWN",  translit: "בראון",   color: "#8b5a2b" },
    { he: "סגול", en: "PURPLE", translit: "פרפל",    color: "#9b59b6" },
    { he: "אפור", en: "GREY",   translit: "גריי",    color: "#95a5a6" },

    // יחידה 2: מילים כלליות
    { he: "מכונית",    en: "CAR",       translit: "קאר",     emoji: "🚗" },
    { he: "חתול",      en: "CAT",       translit: "קאט",     emoji: "🐱" },
    { he: "פרה",       en: "COW",       translit: "קאו",     emoji: "🐮" },
    { he: "שעון",      en: "CLOCK",     translit: "קלוק",    emoji: "🕐" },
    { he: "גזר",       en: "CARROT",    translit: "קרוט",    emoji: "🥕" },
    { he: "אסטרונאוט", en: "ASTRONAUT", translit: "אסטרונאוט", emoji: "🧑‍🚀" },
    { he: "תפוח",      en: "APPLE",     translit: "אפל",     emoji: "🍎" },
    { he: "אבוקדו",    en: "AVOCADO",   translit: "אבוקדו",  emoji: "🥑" },
    { he: "נמלה",      en: "ANT",       translit: "אנט",     emoji: "🐜" },
    { he: "שולחן",     en: "TABLE",     translit: "טייבל",   emoji: "🍽️" },
    { he: "נמר",       en: "TIGER",     translit: "טייגר",   emoji: "🐯" },
    { he: "עץ",        en: "TREE",      translit: "טרי",     emoji: "🌳" },
    { he: "מורה",      en: "TEACHER",   translit: "טיצ'ר",   emoji: "🧑‍🏫" },
    { he: "שתיים",     en: "TWO",       translit: "טו",      emoji: "2️⃣" },
    { he: "עשר",       en: "TEN",       translit: "טן",      emoji: "🔟" },
    { he: "ארנב",      en: "RABBIT",    translit: "ראביט",   emoji: "🐰" },
    { he: "סרגל",      en: "RULER",     translit: "רולר",    emoji: "📏" },
    { he: "תרנגול",    en: "ROOSTER",   translit: "רוסטר",   emoji: "🐓" },
    { he: "עכברוש",    en: "RAT",       translit: "רט",      emoji: "🐀" },
    { he: "עצוב",      en: "SAD",       translit: "סאד",     emoji: "😢" },
    { he: "שמח",       en: "HAPPY",     translit: "הפי",     emoji: "😊" }
  ];

  // Full display text for an English word, e.g. "BLACK (בלאק)"
  function enLabel(w) {
    return `${w.en} (${w.translit})`;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    // one question per word, random direction each time
    return shuffle(words.map(w => {
      const direction = Math.random() < 0.5 ? "heToEn" : "enToHe";
      const correctAnswer = direction === "heToEn" ? enLabel(w) : w.he;
      const pool = words.filter(x => x !== w).map(x => direction === "heToEn" ? enLabel(x) : x.he);
      const distractors = shuffle(pool).slice(0, 3);
      const options = shuffle([correctAnswer, ...distractors]);
      return {
        word: w,
        direction,
        prompt: direction === "heToEn" ? w.he : enLabel(w),
        correctAnswer,
        options
      };
    }));
  }

  let questions = buildQuestions();
  let current = 0;
  let score = 0;
  let answered = false;
  let wrongWords = [];

  // Flashcards state
  let flashDeck = [];
  let flashIndex = 0;
  let flashFlipped = false;

  const card = document.getElementById("card");

  // --- Home screen ---
  function renderHome() {
    card.innerHTML = `
      <div class="mode-select">
        <button class="mode-btn" id="startQuizBtn">
          <span class="mode-btn-emoji">🧠</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">חידון</div>
            <div class="mode-btn-sub">בחירת תשובה נכונה, עם ציון בסוף</div>
          </span>
        </button>
        <button class="mode-btn" id="startFlashAllBtn">
          <span class="mode-btn-emoji">🗂️</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">כרטיסיות</div>
            <div class="mode-btn-sub">תרגול קליל, בלי ציון - כל המילים</div>
          </span>
        </button>
      </div>
    `;
    document.getElementById("startQuizBtn").onclick = () => {
      questions = buildQuestions();
      current = 0;
      score = 0;
      wrongWords = [];
      render();
    };
    document.getElementById("startFlashAllBtn").onclick = () => {
      startFlashcards(words);
    };
  }

  // --- Flashcards ---
  function startFlashcards(deckWords) {
    flashDeck = shuffle(deckWords);
    flashIndex = 0;
    flashFlipped = false;
    renderFlashcard();
  }

  function renderFlashcard() {
    const w = flashDeck[flashIndex];
    const visual = w.color
      ? `<div class="flash-visual-swatch" style="background:${w.color}"></div>`
      : `<div class="flash-visual">${w.emoji}</div>`;

    card.innerHTML = `
      <button class="back-link" id="flashBackBtn">← חזרה לתפריט</button>
      <div class="flash-counter">כרטיס ${flashIndex + 1} מתוך ${flashDeck.length}</div>
      <div class="flash-card-outer">
        <div class="flash-card" id="flashCard">
          <div class="flash-card-inner">
            <div class="flash-face flash-face-front">
              ${visual}
              <div class="flash-word">${w.he}</div>
              <div class="flash-tap-hint">הקישו לראות באנגלית 👆</div>
            </div>
            <div class="flash-face flash-face-back">
              ${visual}
              <div class="flash-word">${enLabel(w)}</div>
              <div class="flash-tap-hint">הקישו לחזור</div>
            </div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="flash-nav-btn secondary" id="flashPrevBtn">→ הקודם</button>
        <button class="flash-nav-btn secondary" id="flashShuffleBtn">🔀</button>
        <button class="flash-nav-btn" id="flashNextBtn">הבא ←</button>
      </div>
    `;

    const flashCardEl = document.getElementById("flashCard");
    if (flashFlipped) flashCardEl.classList.add("flipped");
    flashCardEl.onclick = () => {
      flashFlipped = !flashFlipped;
      flashCardEl.classList.toggle("flipped");
    };

    document.getElementById("flashBackBtn").onclick = () => renderHome();

    document.getElementById("flashPrevBtn").onclick = () => {
      flashFlipped = false;
      flashIndex = (flashIndex - 1 + flashDeck.length) % flashDeck.length;
      renderFlashcard();
    };
    document.getElementById("flashNextBtn").onclick = () => {
      flashFlipped = false;
      flashIndex = (flashIndex + 1) % flashDeck.length;
      renderFlashcard();
    };
    document.getElementById("flashShuffleBtn").onclick = () => {
      flashDeck = shuffle(flashDeck);
      flashIndex = 0;
      flashFlipped = false;
      renderFlashcard();
    };
  }

  function render() {
    if (current >= questions.length) {
      renderResults();
      return;
    }
    const q = questions[current];
    const hint = q.direction === "heToEn"
      ? (q.word.color
          ? `<div class="swatch" style="background:${q.word.color}"></div>`
          : `<div class="swatch-emoji">${q.word.emoji}</div>`)
      : "";
    card.innerHTML = `
      <button class="back-link" id="quizBackBtn">← חזרה לתפריט</button>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${(current / questions.length) * 100}%"></div>
      </div>
      ${hint}
      <div class="question-word">${q.prompt}</div>
      <div class="question-hint">${q.direction === "heToEn" ? "איך אומרים את זה באנגלית?" : "מה המשמעות בעברית?"}</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" disabled>הבא →</button>
    `;

    const optionsDiv = document.getElementById("options");
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(opt, btn);
      optionsDiv.appendChild(btn);
    });

    answered = false;
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
    document.getElementById("quizBackBtn").onclick = () => renderHome();
  }

  function selectAnswer(opt, btn) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const feedback = document.getElementById("feedback");
    const allBtns = document.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true);

    if (opt === q.correctAnswer) {
      btn.classList.add("correct");
      feedback.textContent = "🎉 נכון מאוד!";
      feedback.className = "feedback correct-text";
      score++;
    } else {
      btn.classList.add("wrong");
      feedback.textContent = `לא בדיוק... התשובה הנכונה: ${q.correctAnswer}`;
      feedback.className = "feedback wrong-text";
      wrongWords.push(q.word);
      allBtns.forEach(b => {
        if (b.textContent === q.correctAnswer) b.classList.add("correct");
      });
    }
    document.getElementById("nextBtn").disabled = false;
  }

  function renderResults() {
    const pct = Math.round((score / questions.length) * 100);
    let emoji = "🌟";
    let msg = "כל הכבוד!";
    if (pct < 50) { emoji = "💪"; msg = "התחלה טובה, נתרגל עוד קצת!"; }
    else if (pct < 80) { emoji = "👏"; msg = "יפה מאוד!"; }
    else { emoji = "🏆"; msg = "מעולה, שלטת במילים!"; }

    card.innerHTML = `
      <div class="score-emoji">${emoji}</div>
      <div class="score-text">${score} מתוך ${questions.length} נכונות</div>
      <div class="score-sub">${msg}</div>
      ${wrongWords.length ? `
        <div class="word-list">
          <div class="word-list-title">📝 מילים לתרגול חוזר</div>
          ${wrongWords.map(w => `
            <div class="word-list-row">
              <span class="word-list-he">
                ${w.color
                  ? `<span class="word-list-swatch" style="background:${w.color}"></span>`
                  : `<span class="word-list-emoji">${w.emoji}</span>`}
                ${w.he}
              </span>
              <span class="word-list-en">${enLabel(w)}</span>
            </div>
          `).join("")}
        </div>
      ` : ""}
      <button class="restart-btn" id="restartBtn">🔁 עוד סיבוב</button>
      <div>
        <button class="back-link" id="resultsBackBtn">← חזרה לתפריט</button>
      </div>
    `;
    document.getElementById("restartBtn").onclick = () => {
      questions = buildQuestions();
      current = 0;
      score = 0;
      wrongWords = [];
      render();
    };
    document.getElementById("resultsBackBtn").onclick = () => renderHome();
  }

  renderHome();
</script>
