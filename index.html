<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לומדים אנגלית - צבעים</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-soft: #6b6b6b;
    --accent: #6c5ce7;
    --accent-dark: #5240c9;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --border: #e5e0d8;
    --shadow: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1b2e;
      --card-bg: #2a2640;
      --text: #f2f0f7;
      --text-soft: #b3aecb;
      --accent: #a29bfe;
      --accent-dark: #8b7ff0;
      --border: #3d3860;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1b2e;
    --card-bg: #2a2640;
    --text: #f2f0f7;
    --text-soft: #b3aecb;
    --accent: #a29bfe;
    --accent-dark: #8b7ff0;
    --border: #3d3860;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-soft);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 28px 20px;
    text-align: center;
  }

  .progress-wrap {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .swatch {
    width: 90px;
    height: 90px;
    border-radius: 16px;
    margin: 0 auto 18px auto;
    border: 3px solid var(--border);
  }

  .question-word {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
    word-break: break-word;
  }

  .question-hint {
    color: var(--text-soft);
    margin-bottom: 22px;
    font-size: 0.95rem;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option-btn {
    padding: 14px 10px;
    font-size: 1.1rem;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .option-btn:disabled {
    cursor: default;
  }
  .option-btn.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }
  .option-btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong);
    color: white;
  }

  .feedback {
    min-height: 28px;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .feedback.correct-text { color: var(--correct); }
  .feedback.wrong-text { color: var(--wrong); }

  .next-btn, .restart-btn {
    margin-top: 18px;
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .next-btn:hover, .restart-btn:hover {
    background: var(--accent-dark);
  }
  .next-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .score-emoji {
    font-size: 3.5rem;
    margin-bottom: 10px;
  }
  .score-text {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .score-sub {
    color: var(--text-soft);
    margin-bottom: 10px;
  }

  .word-list-title {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 1.05rem;
    text-align: center;
  }
  .word-list {
    margin-top: 6px;
    text-align: right;
    font-size: 0.95rem;
    color: var(--text);
  }
  .word-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--border);
  }
  .word-list-row:last-child {
    border-bottom: none;
  }
  .word-list-he {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .word-list-swatch {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .word-list-en {
    color: var(--text-soft);
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎨 לומדים אנגלית: צבעים</h1>
  <div class="subtitle">חידון מילים שבועי</div>
  <div class="card" id="card"></div>
</div>

<script>
  // he = Hebrew meaning, en = English word, translit = how to pronounce the
  // English word, written in Hebrew letters, color = swatch color
  const words = [
    { he: "שחור", en: "BLACK",  translit: "בלאק",   color: "#111111" },
    { he: "לבן",  en: "WHITE",  translit: "וויט",    color: "#ffffff" },
    { he: "אדום", en: "RED",    translit: "רד",      color: "#e74c3c" },
    { he: "כחול", en: "BLUE",   translit: "בלו",     color: "#3498db" },
    { he: "צהוב", en: "YELLOW", translit: "ילו",     color: "#f1c40f" },
    { he: "ירוק", en: "GREEN",  translit: "גרין",    color: "#2ecc71" },
    { he: "כתום", en: "ORANGE", translit: "אורנג'",  color: "#e67e22" },
    { he: "ורוד", en: "PINK",   translit: "פינק",    color: "#ff7fb0" },
    { he: "חום",  en: "BROWN",  translit: "בראון",   color: "#8b5a2b" },
    { he: "סגול", en: "PURPLE", translit: "פרפל",    color: "#9b59b6" },
    { he: "אפור", en: "GREY",   translit: "גריי",    color: "#95a5a6" }
  ];

  // Full display text for an English word, e.g. "BLACK (בלאק)"
  function enLabel(w) {
    return `${w.en} (${w.translit})`;
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildQuestions() {
    // one question per word, random direction each time
    return shuffle(words.map(w => {
      const direction = Math.random() < 0.5 ? "heToEn" : "enToHe";
      const correctAnswer = direction === "heToEn" ? enLabel(w) : w.he;
      const pool = words.filter(x => x !== w).map(x => direction === "heToEn" ? enLabel(x) : x.he);
      const distractors = shuffle(pool).slice(0, 3);
      const options = shuffle([correctAnswer, ...distractors]);
      return {
        word: w,
        direction,
        prompt: direction === "heToEn" ? w.he : enLabel(w),
        correctAnswer,
        options
      };
    }));
  }

  let questions = buildQuestions();
  let current = 0;
  let score = 0;
  let answered = false;
  let wrongWords = [];

  const card = document.getElementById("card");

  function render() {
    if (current >= questions.length) {
      renderResults();
      return;
    }
    const q = questions[current];
    card.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${(current / questions.length) * 100}%"></div>
      </div>
      ${q.direction === "heToEn" ? `<div class="swatch" style="background:${q.word.color}"></div>` : ""}
      <div class="question-word">${q.prompt}</div>
      <div class="question-hint">${q.direction === "heToEn" ? "איך אומרים את זה באנגלית?" : "מה המשמעות בעברית?"}</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" disabled>הבא →</button>
    `;

    const optionsDiv = document.getElementById("options");
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(opt, btn);
      optionsDiv.appendChild(btn);
    });

    answered = false;
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
  }

  function selectAnswer(opt, btn) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const feedback = document.getElementById("feedback");
    const allBtns = document.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true);

    if (opt === q.correctAnswer) {
      btn.classList.add("correct");
      feedback.textContent = "🎉 נכון מאוד!";
      feedback.className = "feedback correct-text";
      score++;
    } else {
      btn.classList.add("wrong");
      feedback.textContent = `לא בדיוק... התשובה הנכונה: ${q.correctAnswer}`;
      feedback.className = "feedback wrong-text";
      wrongWords.push(q.word);
      allBtns.forEach(b => {
        if (b.textContent === q.correctAnswer) b.classList.add("correct");
      });
    }
    document.getElementById("nextBtn").disabled = false;
  }

  function renderResults() {
    const pct = Math.round((score / questions.length) * 100);
    let emoji = "🌟";
    let msg = "כל הכבוד!";
    if (pct < 50) { emoji = "💪"; msg = "התחלה טובה, נתרגל עוד קצת!"; }
    else if (pct < 80) { emoji = "👏"; msg = "יפה מאוד!"; }
    else { emoji = "🏆"; msg = "מעולה, שלטת בצבעים!"; }

    card.innerHTML = `
      <div class="score-emoji">${emoji}</div>
      <div class="score-text">${score} מתוך ${questions.length} נכונות</div>
      <div class="score-sub">${msg}</div>
      ${wrongWords.length ? `
        <div class="word-list">
          <div class="word-list-title">📝 מילים לתרגול חוזר</div>
          ${wrongWords.map(w => `
            <div class="word-list-row">
              <span class="word-list-he">
                <span class="word-list-swatch" style="background:${w.color}"></span>
                ${w.he}
              </span>
              <span class="word-list-en">${enLabel(w)}</span>
            </div>
          `).join("")}
        </div>
      ` : ""}
      <button class="restart-btn" id="restartBtn">🔁 עוד סיבוב</button>
    `;
    document.getElementById("restartBtn").onclick = () => {
      questions = buildQuestions();
      current = 0;
      score = 0;
      wrongWords = [];
      render();
    };
  }

  render();
</script>
</body>
</html>
