<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>לומדים אנגלית</title>
<style>
  :root {
    --bg: #fdf6e3;
    --card-bg: #ffffff;
    --text: #2d2d2d;
    --text-soft: #6b6b6b;
    --accent: #6c5ce7;
    --accent-dark: #5240c9;
    --correct: #2ecc71;
    --wrong: #e74c3c;
    --border: #e5e0d8;
    --shadow: rgba(0,0,0,0.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1e1b2e;
      --card-bg: #2a2640;
      --text: #f2f0f7;
      --text-soft: #b3aecb;
      --accent: #a29bfe;
      --accent-dark: #8b7ff0;
      --border: #3d3860;
      --shadow: rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1b2e;
    --card-bg: #2a2640;
    --text: #f2f0f7;
    --text-soft: #b3aecb;
    --accent: #a29bfe;
    --accent-dark: #8b7ff0;
    --border: #3d3860;
    --shadow: rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Arial Hebrew", Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
  }

  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin-bottom: 4px;
  }

  .subtitle {
    text-align: center;
    color: var(--text-soft);
    margin-bottom: 20px;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: 0 8px 24px var(--shadow);
    padding: 28px 20px;
    text-align: center;
  }

  .progress-wrap {
    width: 100%;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.3s ease;
  }

  .swatch {
    width: 90px;
    height: 90px;
    border-radius: 16px;
    margin: 0 auto 18px auto;
    border: 3px solid var(--border);
  }

  .swatch-emoji {
    width: 90px;
    height: 90px;
    border-radius: 16px;
    margin: 0 auto 18px auto;
    border: 3px solid var(--border);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
  }

  .question-word {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 6px;
    word-break: break-word;
  }

  .question-hint {
    color: var(--text-soft);
    margin-bottom: 22px;
    font-size: 0.95rem;
  }

  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .option-btn {
    padding: 14px 10px;
    font-size: 1.1rem;
    border-radius: 14px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease, border-color 0.2s ease;
    font-family: inherit;
  }
  .option-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .option-btn:disabled {
    cursor: default;
  }
  .option-btn.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }
  .option-btn.wrong {
    background: var(--wrong);
    border-color: var(--wrong);
    color: white;
  }

  .feedback {
    min-height: 28px;
    margin-top: 16px;
    font-weight: 700;
    font-size: 1.05rem;
  }
  .feedback.correct-text { color: var(--correct); }
  .feedback.wrong-text { color: var(--wrong); }

  .next-btn, .restart-btn {
    margin-top: 18px;
    padding: 12px 28px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .next-btn:hover, .restart-btn:hover {
    background: var(--accent-dark);
  }
  .next-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .score-emoji {
    font-size: 3.5rem;
    margin-bottom: 10px;
  }
  .score-text {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .score-sub {
    color: var(--text-soft);
    margin-bottom: 10px;
  }

  .word-list-title {
    font-weight: 700;
    margin-bottom: 10px;
    font-size: 1.05rem;
    text-align: center;
  }
  .word-list {
    margin-top: 6px;
    text-align: right;
    font-size: 0.95rem;
    color: var(--text);
  }
  .word-list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 4px;
    border-bottom: 1px dashed var(--border);
  }
  .word-list-row:last-child {
    border-bottom: none;
  }
  .word-list-he {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
  }
  .word-list-swatch {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 2px solid var(--border);
    flex-shrink: 0;
  }
  .word-list-emoji {
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .word-list-en {
    color: var(--text-soft);
  }

  /* --- Home / mode selection --- */
  .mode-select {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .mode-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border-radius: 16px;
    border: 2px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    text-align: right;
    transition: transform 0.1s ease, border-color 0.2s ease;
  }
  .mode-btn:hover {
    transform: translateY(-2px);
    border-color: var(--accent);
  }
  .mode-btn:disabled {
    cursor: default;
    opacity: 0.55;
  }
  .mode-btn:disabled:hover {
    transform: none;
    border-color: var(--border);
  }
  .mode-btn-emoji {
    font-size: 2.2rem;
    flex-shrink: 0;
  }
  .mode-btn-text {
    text-align: right;
  }
  .mode-btn-title {
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 2px;
  }
  .mode-btn-sub {
    font-size: 0.85rem;
    color: var(--text-soft);
  }

  .translit-toggle {
    margin-top: 6px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-radius: 14px;
    border: 2px dashed var(--border);
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
  }
  .translit-toggle:hover {
    border-color: var(--accent);
  }
  .toggle-state {
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }
  .flash-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .flash-top .back-link {
    margin-bottom: 0;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: var(--accent);
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    padding: 0;
  }
  .back-link:hover {
    text-decoration: underline;
  }

  /* --- Flashcards --- */
  .flash-counter {
    text-align: center;
    color: var(--text-soft);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .flash-card-outer {
    perspective: 1200px;
    margin-bottom: 20px;
  }
  .flash-card {
    position: relative;
    width: 100%;
    height: 240px;
    cursor: pointer;
  }
  .flash-card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    text-align: center;
    transition: transform 0.5s;
    transform-style: preserve-3d;
  }
  .flash-card.flipped .flash-card-inner {
    transform: rotateY(180deg);
  }
  .flash-face {
    position: absolute;
    width: 100%;
    height: 100%;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 18px;
    border: 2px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .flash-face-back {
    transform: rotateY(180deg);
  }
  .flash-visual {
    font-size: 3.5rem;
    margin-bottom: 10px;
  }
  .flash-visual-swatch {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    border: 3px solid var(--border);
    margin-bottom: 10px;
  }
  .flash-word {
    font-size: 1.7rem;
    font-weight: 700;
  }
  .flash-tap-hint {
    margin-top: 10px;
    font-size: 0.8rem;
    color: var(--text-soft);
  }
  .speak-btn {
    margin-top: 10px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--card-bg);
    font-size: 1.3rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .speak-btn:hover {
    border-color: var(--accent);
  }
  .flash-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .flash-nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 12px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .flash-nav-btn:hover {
    background: var(--accent-dark);
  }
  .flash-nav-btn.secondary {
    background: var(--bg);
    color: var(--text);
    border: 2px solid var(--border);
    flex: 0 0 auto;
    padding: 12px 16px;
  }
</style>
</head>
<body>
<div class="app">
  <h1>🎓 לומדים אנגלית</h1>
  <div class="subtitle">תרגול מילים שבועי</div>
  <div class="card" id="card"></div>
</div>

<script>
  // he = Hebrew meaning, en = English word, translit = how to pronounce the
  // English word, written in Hebrew letters.
  // Visual hint: "color" for a color swatch, or "emoji" for a picture hint.
  // NOTE: new words are always added at the END of the list - the guided quiz
  // treats the last words in the list as "the newest".
  const words = [
    // יחידה 1: צבעים
    { he: "שחור", en: "BLACK",  translit: "בלאק",   color: "#111111" },
    { he: "לבן",  en: "WHITE",  translit: "וויט",    color: "#ffffff" },
    { he: "אדום", en: "RED",    translit: "רד",      color: "#e74c3c" },
    { he: "כחול", en: "BLUE",   translit: "בלו",     color: "#3498db" },
    { he: "צהוב", en: "YELLOW", translit: "ילו",     color: "#f1c40f" },
    { he: "ירוק", en: "GREEN",  translit: "גרין",    color: "#2ecc71" },
    { he: "כתום", en: "ORANGE", translit: "אורנג'",  color: "#e67e22" },
    { he: "ורוד", en: "PINK",   translit: "פינק",    color: "#ff7fb0" },
    { he: "חום",  en: "BROWN",  translit: "בראון",   color: "#8b5a2b" },
    { he: "סגול", en: "PURPLE", translit: "פרפל",    color: "#9b59b6" },
    { he: "אפור", en: "GREY",   translit: "גריי",    color: "#95a5a6" },

    // יחידה 2: מילים כלליות
    { he: "מכונית",    en: "CAR",       translit: "קאר",     emoji: "🚗" },
    { he: "חתול",      en: "CAT",       translit: "קאט",     emoji: "🐱" },
    { he: "פרה",       en: "COW",       translit: "קאו",     emoji: "🐮" },
    { he: "שעון",      en: "CLOCK",     translit: "קלוק",    emoji: "🕐" },
    { he: "גזר",       en: "CARROT",    translit: "קרוט",    emoji: "🥕" },
    { he: "אסטרונאוט", en: "ASTRONAUT", translit: "אסטרונאוט", emoji: "🧑‍🚀" },
    { he: "תפוח",      en: "APPLE",     translit: "אפל",     emoji: "🍎" },
    { he: "אבוקדו",    en: "AVOCADO",   translit: "אבוקדו",  emoji: "🥑" },
    { he: "נמלה",      en: "ANT",       translit: "אנט",     emoji: "🐜" },
    { he: "שולחן",     en: "TABLE",     translit: "טייבל",   emoji: "🍽️" },
    { he: "נמר",       en: "TIGER",     translit: "טייגר",   emoji: "🐯" },
    { he: "עץ",        en: "TREE",      translit: "טרי",     emoji: "🌳" },
    { he: "מורה",      en: "TEACHER",   translit: "טיצ'ר",   emoji: "🧑‍🏫" },
    { he: "שתיים",     en: "TWO",       translit: "טו",      emoji: "2️⃣" },
    { he: "עשר",       en: "TEN",       translit: "טן",      emoji: "🔟" },
    { he: "ארנב",      en: "RABBIT",    translit: "ראביט",   emoji: "🐰" },
    { he: "סרגל",      en: "RULER",     translit: "רולר",    emoji: "📏" },
    { he: "תרנגול",    en: "ROOSTER",   translit: "רוסטר",   emoji: "🐓" },
    { he: "עכברוש",    en: "RAT",       translit: "רט",      emoji: "🐀" },
    { he: "עצוב",      en: "SAD",       translit: "סאד",     emoji: "😢" },
    { he: "שמח",       en: "HAPPY",     translit: "הפי",     emoji: "😊" },

    // יחידה 3: מילים נוספות
    { he: "משפחה",     en: "FAMILY",    translit: "פמילי",   emoji: "👨‍👩‍👧‍👦" },
    { he: "גדר",       en: "FENCE",     translit: "פנס",     emoji: "🚧" },
    { he: "פרח",       en: "FLOWER",    translit: "פלאואר",  emoji: "🌸" },
    { he: "בית",       en: "HOUSE",     translit: "האוס",    emoji: "🏠" },
    { he: "בניין",     en: "BUILDING",  translit: "בילדינג", emoji: "🏢" },
    { he: "ספר",       en: "BOOK",      translit: "בוק",     emoji: "📖" },
    { he: "תירס",      en: "CORN",      translit: "קורן",    emoji: "🌽" },
    { he: "סיר",       en: "POT",       translit: "פוט",     emoji: "🍲" },
    { he: "מכנסיים",   en: "PANTS",     translit: "פנטס",    emoji: "👖" },
    { he: "חולצה",     en: "SHIRT",     translit: "שירט",    emoji: "👕" },
    { he: "טלפון",     en: "PHONE",     translit: "פון",     emoji: "📱" },
    { he: "משקפיים",   en: "GLASSES",   translit: "גלאסיס",  emoji: "👓" },

    // יחידה 4: מילים נוספות
    { he: "חמור",      en: "DONKEY",     translit: "דונקי",     emoji: "🫏" },
    { he: "כלב",       en: "DOG",        translit: "דוג",       emoji: "🐶" },
    { he: "דבורה",     en: "BEE",        translit: "בי",        emoji: "🐝" },
    { he: "זיקית",     en: "CHAMELEON",  translit: "קמיליון",   emoji: "🦎" },
    { he: "חרק",       en: "INSECT",     translit: "אינסקט",    emoji: "🐛" },
    { he: "מסוק",      en: "HELICOPTER", translit: "הליקופטר",  emoji: "🚁" },
    { he: "כובע",      en: "HAT",        translit: "האט",       emoji: "🎩" },
    { he: "אוגר",      en: "HAMSTER",    translit: "המסטר",     emoji: "🐹" },
    { he: "סוס",       en: "HORSE",      translit: "הורס",      emoji: "🐴" }
  ];

  // --- Show/hide the Hebrew transliteration (2ג') ---
  // Saved in the browser so the choice is remembered between visits.
  const TRANSLIT_KEY = "vocabShowTranslit";

  function loadShowTranslit() {
    try {
      const raw = localStorage.getItem(TRANSLIT_KEY);
      return raw === null ? true : raw === "1"; // default: shown
    } catch (e) {
      return true;
    }
  }

  function saveShowTranslit(value) {
    try {
      localStorage.setItem(TRANSLIT_KEY, value ? "1" : "0");
    } catch (e) {
      // storage unavailable - the choice just won't be remembered
    }
  }

  let showTranslit = loadShowTranslit();

  // Full display text for an English word, e.g. "BLACK (בלאק)"
  // or just "BLACK" when the transliteration is hidden.
  function enLabel(w) {
    return showTranslit ? `${w.en} (${w.translit})` : w.en;
  }

  // Read an English word aloud using the browser's built-in text-to-speech.
  function speakEnglish(text) {
    if (!("speechSynthesis" in window)) return; // not supported, fail silently
    window.speechSynthesis.cancel(); // stop any speech already in progress
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "en-US";
    utterance.rate = 0.9; // slightly slower, easier for a child to follow
    window.speechSynthesis.speak(utterance);
  }

  // --- Persistent "words to practice" list (1ג') ---
  // Stored in the browser (localStorage) so it survives between visits.
  // A word is identified by its Hebrew+English pair.
  const MISTAKES_KEY = "vocabQuizMistakes";

  function wordKey(w) {
    return `${w.he}|${w.en}`;
  }

  function loadMistakeKeys() {
    try {
      const raw = localStorage.getItem(MISTAKES_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return []; // private browsing / storage blocked - just behave as if empty
    }
  }

  function saveMistakeKeys(keys) {
    try {
      localStorage.setItem(MISTAKES_KEY, JSON.stringify(keys));
    } catch (e) {
      // storage unavailable - nothing we can do, fail silently
    }
  }

  // After a quiz round: add newly-wrong words, remove words now answered correctly.
  // Only words that were actually asked in the round are touched.
  function updateMistakes(roundWrongWords, roundRightWords) {
    let keys = loadMistakeKeys();
    const rightKeys = new Set(roundRightWords.map(wordKey));
    keys = keys.filter(k => !rightKeys.has(k));
    roundWrongWords.forEach(w => {
      const k = wordKey(w);
      if (!keys.includes(k)) keys.push(k);
    });
    saveMistakeKeys(keys);
  }

  function getMistakeWords() {
    const keys = loadMistakeKeys();
    return words.filter(w => keys.includes(wordKey(w)));
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // --- Guided quiz: which words go into a round (5א') ---
  const RECENT_COUNT = 10;        // newest words, always included in the default round
  const DEFAULT_EXTRA_RANDOM = 5; // random older words added to the default round
  const RANDOM_ROUND_SIZE = 15;   // size of the "random words" round

  function pickQuizWords(mode) {
    if (mode === "all") return words;
    if (mode === "random") return shuffle(words).slice(0, RANDOM_ROUND_SIZE);
    // default: the newest words + a few random older ones for refreshing
    const recent = words.slice(-RECENT_COUNT);
    const older = words.slice(0, -RECENT_COUNT);
    const extra = shuffle(older).slice(0, DEFAULT_EXTRA_RANDOM);
    return [...recent, ...extra];
  }

  // Builds one question per word in `subset`. Wrong answers are always drawn
  // from the full word list, so every question still has 4 good options.
  function buildQuestions(subset = words) {
    // one question per word, random direction each time
    return shuffle(subset.map(w => {
      const direction = Math.random() < 0.5 ? "heToEn" : "enToHe";
      const correctAnswer = direction === "heToEn" ? enLabel(w) : w.he;
      const pool = words.filter(x => x !== w).map(x => direction === "heToEn" ? enLabel(x) : x.he);
      const distractors = shuffle(pool).slice(0, 3);
      const options = shuffle([correctAnswer, ...distractors]);
      return {
        word: w,
        direction,
        prompt: direction === "heToEn" ? w.he : enLabel(w),
        correctAnswer,
        options
      };
    }));
  }

  let questions = buildQuestions();
  let current = 0;
  let score = 0;
  let answered = false;
  let wrongWords = [];
  let rightWords = [];
  let quizMode = "default"; // "default" | "all" | "random" - remembered for "עוד סיבוב"

  // Flashcards state
  let flashDeck = [];
  let flashIndex = 0;
  let flashFlipped = false;

  const card = document.getElementById("card");

  // --- Quiz setup (5א') ---
  function startQuiz(mode) {
    quizMode = mode;
    questions = buildQuestions(pickQuizWords(mode));
    current = 0;
    score = 0;
    wrongWords = [];
    rightWords = [];
    render();
  }

  function renderQuizChooser() {
    card.innerHTML = `
      <button class="back-link" id="chooserBackBtn">← חזרה לתפריט</button>
      <div class="word-list-title">איזה חידון בא לך?</div>
      <div class="mode-select">
        <button class="mode-btn" id="quizDefaultBtn">
          <span class="mode-btn-emoji">🌱</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">ברירת מחדל</div>
            <div class="mode-btn-sub">${RECENT_COUNT} המילים החדשות + ${DEFAULT_EXTRA_RANDOM} מילים אקראיות</div>
          </span>
        </button>
        <button class="mode-btn" id="quizAllBtn">
          <span class="mode-btn-emoji">📚</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">כל המילים</div>
            <div class="mode-btn-sub">${words.length} שאלות, על כל המילים</div>
          </span>
        </button>
        <button class="mode-btn" id="quizRandomBtn">
          <span class="mode-btn-emoji">🎲</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">${RANDOM_ROUND_SIZE} מילים אקראיות</div>
            <div class="mode-btn-sub">סיבוב קצר על מילים מכל הרשימה</div>
          </span>
        </button>
      </div>
    `;
    document.getElementById("chooserBackBtn").onclick = () => renderHome();
    document.getElementById("quizDefaultBtn").onclick = () => startQuiz("default");
    document.getElementById("quizAllBtn").onclick = () => startQuiz("all");
    document.getElementById("quizRandomBtn").onclick = () => startQuiz("random");
  }

  // --- Home screen ---
  function renderHome() {
    const mistakeWords = getMistakeWords();
    const hasMistakes = mistakeWords.length > 0;

    card.innerHTML = `
      <div class="mode-select">
        <button class="mode-btn" id="startQuizBtn">
          <span class="mode-btn-emoji">🧠</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">חידון</div>
            <div class="mode-btn-sub">בחירת תשובה נכונה, עם ציון בסוף</div>
          </span>
        </button>
        <button class="mode-btn" id="startFlashAllBtn">
          <span class="mode-btn-emoji">🗂️</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">כרטיסיות</div>
            <div class="mode-btn-sub">תרגול קליל, בלי ציון - כל המילים</div>
          </span>
        </button>
        <button class="mode-btn" id="startFlashMistakesBtn" ${hasMistakes ? "" : "disabled"}>
          <span class="mode-btn-emoji">🎯</span>
          <span class="mode-btn-text">
            <div class="mode-btn-title">תרגול טעויות</div>
            <div class="mode-btn-sub">${hasMistakes
              ? `כרטיסיות רק על ${mistakeWords.length} מילים שטעית בהן`
              : "אין כרגע מילים לתרגול - כל הכבוד! 🎉"}</div>
          </span>
        </button>
        <button class="translit-toggle" id="translitToggleBtn">
          <span>🔤 תעתיק בעברית ליד המילה באנגלית</span>
          <span class="toggle-state">${showTranslit ? "מוצג ✓" : "מוסתר"}</span>
        </button>
      </div>
    `;
    document.getElementById("translitToggleBtn").onclick = () => {
      showTranslit = !showTranslit;
      saveShowTranslit(showTranslit);
      renderHome();
    };
    document.getElementById("startQuizBtn").onclick = () => renderQuizChooser();
    document.getElementById("startFlashAllBtn").onclick = () => {
      startFlashcards(words);
    };
    if (hasMistakes) {
      document.getElementById("startFlashMistakesBtn").onclick = () => {
        startFlashcards(mistakeWords);
      };
    }
  }

  // --- Flashcards ---
  function startFlashcards(deckWords) {
    flashDeck = shuffle(deckWords);
    flashIndex = 0;
    flashFlipped = false;
    renderFlashcard();
  }

  function renderFlashcard() {
    const w = flashDeck[flashIndex];
    const visual = w.color
      ? `<div class="flash-visual-swatch" style="background:${w.color}"></div>`
      : `<div class="flash-visual">${w.emoji}</div>`;

    card.innerHTML = `
      <div class="flash-top">
        <button class="back-link" id="flashBackBtn">← חזרה לתפריט</button>
        <button class="back-link" id="flashTranslitBtn">${showTranslit ? "הסתר תעתיק 🙈" : "הצג תעתיק 👀"}</button>
      </div>
      <div class="flash-counter">כרטיס ${flashIndex + 1} מתוך ${flashDeck.length}</div>
      <div class="flash-card-outer">
        <div class="flash-card" id="flashCard">
          <div class="flash-card-inner">
            <div class="flash-face flash-face-front">
              ${visual}
              <div class="flash-word">${w.he}</div>
              <div class="flash-tap-hint">הקישו לראות באנגלית 👆</div>
            </div>
            <div class="flash-face flash-face-back">
              ${visual}
              <div class="flash-word">${enLabel(w)}</div>
              <button class="speak-btn" id="speakBtn" title="השמע שוב">🔊</button>
              <div class="flash-tap-hint">הקישו לחזור</div>
            </div>
          </div>
        </div>
      </div>
      <div class="flash-nav">
        <button class="flash-nav-btn secondary" id="flashPrevBtn">→ הקודם</button>
        <button class="flash-nav-btn secondary" id="flashShuffleBtn">🔀</button>
        <button class="flash-nav-btn" id="flashNextBtn">הבא ←</button>
      </div>
    `;

    const flashCardEl = document.getElementById("flashCard");
    if (flashFlipped) flashCardEl.classList.add("flipped");
    flashCardEl.onclick = () => {
      flashFlipped = !flashFlipped;
      flashCardEl.classList.toggle("flipped");
      if (flashFlipped) speakEnglish(w.en); // read it out loud the moment English is revealed
    };

    document.getElementById("speakBtn").onclick = (e) => {
      e.stopPropagation(); // don't let the click also flip the card back
      speakEnglish(w.en);
    };

    document.getElementById("flashBackBtn").onclick = () => {
      window.speechSynthesis.cancel();
      renderHome();
    };

    document.getElementById("flashTranslitBtn").onclick = () => {
      showTranslit = !showTranslit;
      saveShowTranslit(showTranslit);
      renderFlashcard(); // keeps the same card and flip state
    };

    document.getElementById("flashPrevBtn").onclick = () => {
      window.speechSynthesis.cancel();
      flashFlipped = false;
      flashIndex = (flashIndex - 1 + flashDeck.length) % flashDeck.length;
      renderFlashcard();
    };
    document.getElementById("flashNextBtn").onclick = () => {
      window.speechSynthesis.cancel();
      flashFlipped = false;
      flashIndex = (flashIndex + 1) % flashDeck.length;
      renderFlashcard();
    };
    document.getElementById("flashShuffleBtn").onclick = () => {
      window.speechSynthesis.cancel();
      flashDeck = shuffle(flashDeck);
      flashIndex = 0;
      flashFlipped = false;
      renderFlashcard();
    };
  }

  function render() {
    if (current >= questions.length) {
      renderResults();
      return;
    }
    const q = questions[current];
    const hint = q.direction === "heToEn"
      ? (q.word.color
          ? `<div class="swatch" style="background:${q.word.color}"></div>`
          : `<div class="swatch-emoji">${q.word.emoji}</div>`)
      : "";
    card.innerHTML = `
      <button class="back-link" id="quizBackBtn">← חזרה לתפריט</button>
      <div class="progress-wrap">
        <div class="progress-bar" style="width:${(current / questions.length) * 100}%"></div>
      </div>
      ${hint}
      <div class="question-word">${q.prompt}</div>
      <div class="question-hint">${q.direction === "heToEn" ? "איך אומרים את זה באנגלית?" : "מה המשמעות בעברית?"}</div>
      <div class="options" id="options"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn" disabled>הבא →</button>
    `;

    const optionsDiv = document.getElementById("options");
    q.options.forEach(opt => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = opt;
      btn.onclick = () => selectAnswer(opt, btn);
      optionsDiv.appendChild(btn);
    });

    answered = false;
    document.getElementById("nextBtn").onclick = () => {
      current++;
      render();
    };
    document.getElementById("quizBackBtn").onclick = () => renderHome();
  }

  function selectAnswer(opt, btn) {
    if (answered) return;
    answered = true;
    const q = questions[current];
    const feedback = document.getElementById("feedback");
    const allBtns = document.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true);

    if (opt === q.correctAnswer) {
      btn.classList.add("correct");
      feedback.textContent = "🎉 נכון מאוד!";
      feedback.className = "feedback correct-text";
      score++;
      rightWords.push(q.word);
    } else {
      btn.classList.add("wrong");
      feedback.textContent = `לא בדיוק... התשובה הנכונה: ${q.correctAnswer}`;
      feedback.className = "feedback wrong-text";
      wrongWords.push(q.word);
      allBtns.forEach(b => {
        if (b.textContent === q.correctAnswer) b.classList.add("correct");
      });
    }
    document.getElementById("nextBtn").disabled = false;
  }

  function renderResults() {
    updateMistakes(wrongWords, rightWords);
    const pct = Math.round((score / questions.length) * 100);
    let emoji = "🌟";
    let msg = "כל הכבוד!";
    if (pct < 50) { emoji = "💪"; msg = "התחלה טובה, נתרגל עוד קצת!"; }
    else if (pct < 80) { emoji = "👏"; msg = "יפה מאוד!"; }
    else { emoji = "🏆"; msg = "מעולה, שלטת במילים!"; }

    card.innerHTML = `
      <div class="score-emoji">${emoji}</div>
      <div class="score-text">${score} מתוך ${questions.length} נכונות</div>
      <div class="score-sub">${msg}</div>
      ${wrongWords.length ? `
        <div class="word-list">
          <div class="word-list-title">📝 מילים לתרגול חוזר</div>
          ${wrongWords.map(w => `
            <div class="word-list-row">
              <span class="word-list-he">
                ${w.color
                  ? `<span class="word-list-swatch" style="background:${w.color}"></span>`
                  : `<span class="word-list-emoji">${w.emoji}</span>`}
                ${w.he}
              </span>
              <span class="word-list-en">${enLabel(w)}</span>
            </div>
          `).join("")}
        </div>
      ` : ""}
      <button class="restart-btn" id="restartBtn">🔁 עוד סיבוב</button>
      <div>
        <button class="back-link" id="resultsBackBtn">← חזרה לתפריט</button>
      </div>
    `;
    document.getElementById("restartBtn").onclick = () => startQuiz(quizMode);
    document.getElementById("resultsBackBtn").onclick = () => renderHome();
  }

  renderHome();
</script>
</body>
</html>
